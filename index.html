<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no" />
    <meta
      name="description"
      content="A Meta Ray-Ban Display prototype that simulates asking Meta for an opinion about a chair."
    />
    <meta name="mrbd-web-app-capable" content="yes" />
    <title>Chair Sense</title>
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-label="Chair Sense prototype">
      <header class="topbar">
        <span id="clock">--:--</span>
        <strong>Chair Sense</strong>
        <span id="stepCount">1/5</span>
      </header>

      <section id="scene" class="scene state-idle" aria-live="polite">
        <img class="capture" src="assets/chair-capture.jpg" alt="Captured lounge chair in a showroom" />
        <div class="shade"></div>
        <div class="reticle" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="scan" aria-hidden="true"></div>

        <section class="response">
          <p class="label" id="label">Standby</p>
          <h1 id="title">Point at the chair</h1>
          <p id="copy">"Hey Meta, what do you think about this?"</p>
          <ul id="signals" class="signals"></ul>
        </section>
      </section>

      <nav class="actions" aria-label="Prototype controls">
        <button class="focusable action" id="prevBtn" type="button">Prev</button>
        <button class="focusable action primary" id="primaryBtn" type="button">Ask</button>
        <button class="focusable action" id="nextBtn" type="button">Next</button>
      </nav>
    </main>

    <script src="script.js"></script>
  </body>
</html>

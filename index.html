<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no" />
    <meta
      name="description"
      content="A Meta Ray-Ban Display prototype that fakes a chair photo capture and analysis flow."
    />
    <meta name="mrbd-web-app-capable" content="yes" />
    <title>Chair Sense</title>
    <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" class="app state-idle" aria-label="Chair Sense fake capture prototype" aria-live="polite">
      <img class="capture" src="assets/user-chair-capture.jpg" alt="Simulated captured photo of the chair" />
      <div class="flash" aria-hidden="true"></div>
      <div class="reticle" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="scan" aria-hidden="true"></div>

      <section class="panel" aria-label="Analysis response">
        <p class="label" id="label">Captured</p>
        <h1 id="title">Looking at the chair</h1>
        <p id="copy">Using the photo now.</p>
        <ul id="signals" class="signals"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
